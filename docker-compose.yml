# ⚠️ RETIRED — this project no longer has its own container.
#
# Superseded 2026-08-16 by the unified dev container, which is a strict
# superset: identical Node/wrangler/gh/TF/torch/playwright toolchain, PLUS the
# met11 science environment and every repo under ~/code mounted at once.
#
#   cd ~/code/infra/dev
#   docker compose up -d dev                    # CPU   8080/8787/8888
#   docker compose --profile gpu up -d dev-gpu  # GPU   8090/8797/8898
#   docker compose exec dev bash                # shell — starts in met11
#
# Inside the container this project is at /workspace/wxwords, and `ml` switches
# from met11 to the TF/torch environment.
#
# This file is kept only as a signpost. The Dockerfile alongside it is likewise
# retired — the image is now built from ~/code/infra/dev/Dockerfile.
#
# NOTE for snowie: its compose builds from `../wxwords`. Repoint it at
# ~/code/infra/dev when snowie is set up (Phase 11), or give it its own image.

services:
  dev:
    image: alpine
    command: >
      sh -c 'echo "";
             echo "  This compose file is retired.";
             echo "  Use:  cd ~/code/infra/dev && docker compose up -d dev";
             echo "";
             exit 1'
